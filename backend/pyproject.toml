[project]
name = "organizador-api"
version = "0.1.0"
description = "Home organizer API: tasks, routines, shopping, pantry, pets, finances and files."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.3",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "bcrypt==5.0.0",
    "PyJWT==2.15.1",
    "python-multipart==0.0.32",
    "boto3==1.43.112",
    # Transitive pins: keep boto3's companions on releases at least two weeks old.
    "botocore==1.43.114",
    "s3transfer==0.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real external services (Garage); run with -m integration, skip with -m \"not integration\"",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
