version: 2

# Every ecosystem waits 14 days after a release before proposing it (project rule: only versions
# published at least two weeks ago). Security updates are not delayed by the cooldown.
# Minor and patch updates come grouped in one weekly PR per ecosystem; majors come one by one.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must follow the installed Node major (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint and openapi-typescript only support TypeScript 5.x.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Images used by docker-compose.yml (postgres, garage, python, adminer).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images-minor-patch:
        update-types: [minor, patch]
    ignore:
      # A new PostgreSQL major cannot open the existing data volume: it needs a planned dump/restore.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # The project is pinned to Python 3.12.
      - dependency-name: python
        versions: [">=3.13"]

  # Base images of the Dockerfiles: python (backend), node and nginx (frontend). Tags and digests are
  # updated together.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dockerfiles-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The project is pinned to Python 3.12.
      - dependency-name: python
        versions: [">=3.13"]
      # Node 24 is the LTS used by the CI and by the build stage; 25+ only when planned.
      - dependency-name: node
        versions: [">=25"]
      # Stay on the stable branch (1.30.x): 1.31 is nginx's mainline.
      - dependency-name: nginx
        versions: [">=1.31"]
