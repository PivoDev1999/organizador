# Reverse proxy to the API container. $api_upstream is a variable, so `api` is resolved at request time
# (Docker DNS, see `resolver`): Nginx starts even if the API is down and follows a recreated container.
# With a variable and no URI part, the original request URI is passed unchanged.
proxy_pass $api_upstream;
# The API is on the same machine: if it does not accept the connection in 5 s, it is down.
proxy_connect_timeout 5s;
# API down, restarting or migrating: JSON like the API's own errors (see @api_down in the template).
error_page 502 503 504 @api_down;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Nginx is the edge: it replaces (not appends to) whatever the client sent in X-Forwarded-For.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
