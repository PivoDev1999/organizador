# Security headers of the app pages (SPA). Included in each location that serves them, because add_header
# is not inherited by a location that has its own add_header. Never used under /api/files: the API sets the
# headers of the downloads (nosniff + CSP sandbox) and they must reach the browser untouched.
#
# CSP: everything comes from this origin (no CDN, no inline script or style in the build).
# - img-src blob: data:  image previews of the attachments (blob URLs) and small inline images.
# - frame-src blob:      PDF preview of the attachments (iframe with a blob URL).
# - no 'unsafe-inline' in style-src: React and Recharts set styles through the DOM (element.style),
#   which CSP does not block; only <style> elements and style="" in markup would need it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
