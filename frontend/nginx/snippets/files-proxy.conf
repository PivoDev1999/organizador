# /api/files: attachments. Included by `location = /api/files` and `location /api/files/`.
# The body limit (client_max_body_size) is set in the template, which has access to MAX_UPLOAD_MB.
error_page 413 = @file_too_large;

# Stream both ways: the upload goes to the API as it arrives (no temporary copy here) and the download
# reaches the browser while the API reads it from Garage, without buffering whole files in Nginx.
proxy_request_buffering off;
proxy_buffering off;

# Large files over Wi-Fi: generous timeouts between two reads/writes (not for the whole transfer).
client_body_timeout 120s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
send_timeout 300s;

include /etc/nginx/snippets/proxy-api.conf;
