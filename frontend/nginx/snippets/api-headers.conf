# Headers of the API responses (JSON and the /api/docs page), except /api/files, which keeps the API's own.
# hide + add: exactly one copy of each, even when the API already sends it (the docs page does).
# No CSP here: the docs page sends its own, and two policies would both apply.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
