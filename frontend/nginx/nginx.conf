# Main Nginx configuration of the `web` image. The site (static files + reverse proxy of the API) is in
# templates/default.conf.template, rendered to /etc/nginx/conf.d/ when the container starts.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Login attempts per client IP: 5 per minute (one every 12 s) with a burst of 4 served at once, so the
    # 6th wrong password within a minute gets 429. Only POST counts: an empty key is not limited.
    map $request_method $login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_limit_key zone=login:1m rate=5r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
