# Main Nginx configuration of the `web` image. The site (static files + reverse proxy of the API) is in
# templates/default.conf.template, rendered to /etc/nginx/conf.d/ when the container starts.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access log in logfmt (`key=value`, one line per request), like the API's logs (backend/app/core/logs.py).
    # request_id is the same id sent to the API in X-Request-ID (snippets/proxy-api.conf), so
    # `docker compose logs api web | grep request_id=<id>` shows both sides of one request.
    # Privacy: only the path of the request, never the query string (it can carry personal data, e.g. a
    # search) and no Referer (which may carry one too). The path comes from $request_uri, the URI the client
    # asked for, cut at the "?": $uri would log /index.html for every page of the SPA (try_files rewrites it).
    map $request_uri $request_path {
        "~^(?<path_only>[^?]*)" $path_only;
        default "-";
    }
    # escape=default: '"', '\' and control characters (ESC included) are written as \xNN. upstream_status
    # is quoted because it can be a list ("502, 502") when Nginx tried more than once.
    log_format main escape=default
                    'time=$time_iso8601 logger=nginx.access request_id=$request_id '
                    'client=$remote_addr method=$request_method path="$request_path" status=$status '
                    'bytes=$body_bytes_sent duration_s=$request_time upstream_status="$upstream_status" '
                    'user_agent="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Login attempts per client IP: 5 per minute (one every 12 s) with a burst of 4 served at once, so the
    # 6th wrong password within a minute gets 429. Only POST counts: an empty key is not limited.
    map $request_method $login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_limit_key zone=login:1m rate=5r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
