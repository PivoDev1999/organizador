name: organizador

# Log rotation for every service: at most 3 files of 10 MB each (docker compose logs <service>).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:${S3_PORT:-3900}:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: assigns the node layout, imports the S3 key and creates the buckets (app and tests).
  # Idempotent, so it is safe to run on every `docker compose up`.
  garage-init:
    image: python:3.12.15-alpine
    restart: "no"
    logging: *default-logging
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-10G}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_TEST_BUCKET: ${S3_TEST_BUCKET:-organizador-test}
    volumes:
      - ./infra/garage/init.py:/init.py:ro
    command: ["python", "-u", "/init.py"]

  adminer:
    image: adminer:5.4.1
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

  # FastAPI (backend/Dockerfile). No published port: only `web` (Nginx) reaches it, through the `proxy`
  # network. On start it waits for Postgres, runs `alembic upgrade head` once and starts uvicorn.
  api:
    build: ./backend
    image: organizador-api:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    # Explicit list (not env_file): the API gets only what it uses, never the Garage admin token or RPC
    # secret. Values come from .env; only the addresses change inside Docker.
    environment:
      # Fixed here, not read from .env (whose values are for development with uvicorn).
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      # Public registration always closed in production: accounts come from
      # `docker compose exec api python -m scripts.create_user` (see README to open it temporarily).
      ALLOW_REGISTRATION: "false"
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      # Only for `docker compose exec api python -m scripts.seed` (demo data).
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      API_WORKERS: ${API_WORKERS:-2}
      # uvicorn trusts X-Forwarded-For/-Proto only from this network (where only `web` lives with it).
      FORWARDED_ALLOW_IPS: ${PROXY_SUBNET:-172.31.250.0/28}
    networks:
      - default
      - proxy
    read_only: true
    # Multipart uploads are spooled here (in RAM) before going to Garage. Capped so a burst of uploads
    # cannot eat the host's memory: 256m fits about 12 simultaneous uploads of 20 MB (raise API_TMP_SIZE
    # with MAX_UPLOAD_MB). When it is full, the upload in progress fails with an error (the client gets a
    # 5xx and can retry); the API keeps running and the host is not affected.
    tmpfs:
      - /tmp:size=${API_TMP_SIZE:-256m},mode=1777
    security_opt:
      - no-new-privileges:true

  # Nginx: the React build and the reverse proxy of /api (frontend/Dockerfile, frontend/nginx/).
  # The only service published on the home network.
  web:
    build: ./frontend
    image: organizador-web:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # Started is enough: Nginx resolves `api` per request, so it answers 502 (not crash) while the API
      # is still migrating or restarting.
      api:
        condition: service_started
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
    networks:
      - proxy
    # The Nginx master runs as root inside the container (to bind port 80 and switch the workers to the
    # `nginx` user); only the capabilities that needs are kept.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  default:
  # Only `web` and `api`: Nginx cannot reach Postgres, Garage or Adminer. Fixed subnet so uvicorn knows
  # which proxy to trust; change PROXY_SUBNET in .env if it clashes with another network of the machine.
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.31.250.0/28}

volumes:
  postgres_data:
  garage_meta:
  garage_data:
